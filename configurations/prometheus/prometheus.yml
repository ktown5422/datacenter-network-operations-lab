global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/lab-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: node
    static_configs:
      - targets: ['10.10.30.1:9100']
        labels:
          host: dc-network-01
      - targets: ['10.10.20.10:9100']
        labels:
          host: dc-server-01
      - targets: ['127.0.0.1:9100']
        labels:
          host: dc-monitor-01
  - job_name: http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://10.10.20.10/']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
