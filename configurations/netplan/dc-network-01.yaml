# Change interface names to match your router. Keep management DHCP in its existing file.
network:
  version: 2
  renderer: networkd
  ethernets:
    enp0s2:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      addresses: [10.10.20.1/24]
    enp0s3:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      addresses: [10.10.30.1/24]
